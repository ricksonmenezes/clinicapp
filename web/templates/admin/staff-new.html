{{define "content"}}
<section>
  <h1>New staff account</h1>
  <p>Creates a clinician, attendant, or admin account — active immediately, no email
    verification round-trip. The account's user id is shown after creation; you'll need it to
    create the matching consultant/attendant profile.</p>
</section>

<section class="card">
  <div id="staff-create-result"></div>
  <form method="post" action="/auth/register-staff" data-json data-target="#staff-create-result">
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <label>Role
      <select name="role" required>
        <option value="clinician">Clinician</option>
        <option value="attendant">Attendant</option>
        <option value="admin">Admin</option>
      </select>
    </label>
    <button type="submit">Create account</button>
  </form>
</section>
{{end}}
