{{define "content"}}
<section>
  <h1>Attendants</h1>
</section>

<section class="card" data-admin-resource="attendants">
  <h2>All attendants</h2>
  <ul class="admin-list" hx-get="/attendants" hx-trigger="load" hx-swap="innerHTML">Loading…</ul>
  <p class="hint">Click an attendant to edit their profile.</p>

  <h3>Create attendant profile</h3>
  <p class="hint">First create the attendant's account under
    <a href="/admin/staff/new">New staff account</a>, then find them by name below.</p>
  <div id="attendant-create-result"></div>
  <form method="post" action="/attendants" data-json data-target="#attendant-create-result">
    <div data-user-picker data-role="attendant" data-unlinked="true">
      <label>Find attendant account
        <input type="text" data-picker-query placeholder="Type a name…" autocomplete="off">
      </label>
      <ul class="admin-list" data-picker-results></ul>
      <p class="hint" data-picker-selected>No account selected yet.</p>
      <input type="hidden" name="user_id" data-picker-value required>
    </div>
    <label>Full name
      <input type="text" name="full_name" data-picker-autofill="full_name" required>
    </label>
    <button type="submit">Create</button>
  </form>

  <form class="admin-edit-form" method="PATCH" action="" data-json data-target="#attendant-edit-result" hidden>
    <h3>Edit attendant</h3>
    <div id="attendant-edit-result"></div>
    <label>Full name
      <input type="text" name="full_name" data-field="full_name" required>
    </label>
    <button type="submit">Save changes</button>
  </form>
</section>
{{end}}
