{{define "content"}}
<section>
  <h1>New staff account</h1>
  <p>Creates a clinician, attendant, or admin account — active immediately, no email
    verification round-trip. Afterwards, find this person by name on the Consultants or
    Attendants page to create their profile — you never need to handle their account id.</p>
</section>

<section class="card">
  <div id="staff-create-result"></div>
  <form method="post" action="/auth/register-staff" data-json data-target="#staff-create-result">
    <label>Full name
      <input type="text" name="full_name" required>
    </label>
    <label>Date of birth (optional — only needed to tell apart two staff who share a name)
      <input type="date" name="date_of_birth">
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <label>Role
      <select name="role" required>
        <option value="clinician">Clinician</option>
        <option value="attendant">Attendant</option>
        <option value="admin">Admin</option>
      </select>
    </label>
    <button type="submit">Create account</button>
  </form>
</section>
{{end}}
